name: Nightly bindings

# Builds, from the latest openDAQ main, the two things a language binding needs:
#   - opendaq.json, the machine-readable API spec, and
#   - the C bindings library (plus the openDAQ runtime and reference modules) per platform,
# and publishes them as assets of a `nightly-<date>-<upstream>-<overlay>` release.
#
# A run is skipped when neither openDAQ nor the generator overlay moved since the last release.
# Every step is a script under scripts/, which also runs outside of CI; this file only wires them
# into jobs.

'on':
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: "openDAQ commit to build (default: tip of UPSTREAM_REF from nightly.env)."
        required: false
        type: string
      overlay_sha:
        description: "Overlay commit to apply (default: tip of OVERLAY_REF from nightly.env)."
        required: false
        type: string
      force:
        description: "Rebuild and replace the release even if it already exists."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Resolve sources, generate spec
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
          OVERLAY_SHA: ${{ inputs.overlay_sha }}
          FORCE: ${{ inputs.force }}
        run: scripts/resolve-release.sh "$UPSTREAM_SHA" "$OVERLAY_SHA" "$FORCE" | tee -a "$GITHUB_OUTPUT"

      - if: steps.resolve.outputs.skip != 'true'
        run: scripts/install-deps.sh generators

      - if: steps.resolve.outputs.skip != 'true'
        run: >-
          scripts/prepare-source.sh "$RUNNER_TEMP/work"
          "${{ steps.resolve.outputs.upstream_sha }}" "${{ steps.resolve.outputs.overlay_sha }}"
          && mkdir -p spec && cp "$RUNNER_TEMP"/work/out/* spec/

      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          name: spec
          path: spec
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.triple }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: linux-x64, runner: ubuntu-22.04 }
          - { triple: darwin-arm64, runner: macos-15 }
          - { triple: windows-x64, runner: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spec
          path: spec
      - uses: jwlawson/actions-setup-cmake@v2
      - uses: seanmiddleditch/gha-setup-ninja@v6
        if: runner.os != 'Windows'

      - run: scripts/checkout-source.sh openDAQ "${{ needs.prepare.outputs.upstream_sha }}" spec/bindings-overlay.patch
      - run: scripts/install-deps.sh build openDAQ
      - run: scripts/build-natives.sh "${{ matrix.triple }}" openDAQ build dist

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.triple }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  # Runs next to the release builds, from the same sources, and does not hold up the release: a
  # failure shows on the run without keeping the spec and the libraries from being published.
  test:
    name: C bindings tests (linux-x64)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spec
          path: spec
      - uses: jwlawson/actions-setup-cmake@v2
      - uses: seanmiddleditch/gha-setup-ninja@v6

      - run: scripts/checkout-source.sh openDAQ "${{ needs.prepare.outputs.upstream_sha }}" spec/bindings-overlay.patch
      - run: scripts/install-deps.sh build openDAQ
      - run: scripts/test-c-bindings.sh openDAQ build

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spec
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: dist
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh dist "${{ needs.prepare.outputs.tag }}" "${{ github.repository }}"
